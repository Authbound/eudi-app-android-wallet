name: Android UI Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run auth-gate smoke suite
        run: ./gradlew :app:smokeGroupDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.auth_test_application=true -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --stacktrace

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-smoke-reports
          path: |
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/outputs/managed_device_android_test_additional_output/**

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run nightly auth-gate regression suite
        run: ./gradlew :app:nightlyGroupDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.auth_test_application=true -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --stacktrace

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-nightly-reports
          path: |
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/outputs/managed_device_android_test_additional_output/**
